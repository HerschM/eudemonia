# Bindings to the llama.cpp C API used by lib/features/ai_processing/native/llama_backend.dart.
# Run tool/generate_llama_bindings.sh, not ffigen directly: it links the llama.cpp checkout to
# .dart_tool/llama_cpp_src, which the paths below refer to. Only the functions listed here (and the
# structs and enums they use) are generated; add a function here before using it.
name: LlamaBindings
description: Bindings to the llama.cpp C API (generated by tool/generate_llama_bindings.sh).
output: lib/features/ai_processing/native/llama_bindings.g.dart
headers:
  entry-points:
    - .dart_tool/llama_cpp_src/include/llama.h
  include-directives:
    - '**llama.h'
    - '**ggml.h'
    - '**ggml-cpu.h'
    - '**ggml-backend.h'
compiler-opts:
  - '-I.dart_tool/llama_cpp_src/include'
  - '-I.dart_tool/llama_cpp_src/ggml/include'
exclude-all-by-default: true
functions:
  include:
    # libllama
    - llama_backend_init
    - llama_model_default_params
    - llama_context_default_params
    - llama_sampler_chain_default_params
    - llama_model_load_from_file
    - llama_model_free
    - llama_init_from_model
    - llama_free
    - llama_n_ctx
    - llama_model_get_vocab
    - llama_get_memory
    - llama_memory_seq_rm
    - llama_batch_init
    - llama_batch_free
    - llama_decode
    - llama_set_n_threads
    - llama_attach_threadpool
    - llama_tokenize
    - llama_token_to_piece
    - llama_vocab_is_eog
    - llama_sampler_chain_init
    - llama_sampler_chain_add
    - llama_sampler_init_greedy
    - llama_sampler_init_grammar
    - llama_sampler_sample
    - llama_sampler_free
    # libggml-base
    - ggml_threadpool_params_default
    # libggml-cpu
    - ggml_threadpool_new
    - ggml_threadpool_free
# Structs the backend fills or reads by field; every other struct is only pointed to and stays opaque.
structs:
  include:
    - llama_model_params
    - llama_context_params
    - llama_sampler_chain_params
    - llama_batch
    - ggml_threadpool_params
  dependency-only: opaque
unions:
  dependency-only: opaque
# The enums in the parameter structs are plain C enums, which clang and ffigen both size as int.
silence-enum-warning: true
preamble: |
  // ignore_for_file: type=lint, unused_element, unused_field
comments:
  style: any
  length: brief
